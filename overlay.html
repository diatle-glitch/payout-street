<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Night Circuit — OBS overlay</title>
<style>
  html,body{margin:0;background:transparent;color:#F4F1EA;font-family:"Saira Condensed",sans-serif}
  .bug{position:fixed;right:24px;bottom:24px;padding:10px 14px;border-radius:10px;background:rgba(18,16,26,.82);box-shadow:0 0 0 1px #F5C542}
  .word{font-family:Anton,sans-serif;transform:skewX(-8deg);font-size:22px;line-height:.9}
  .gold{color:#F5C542}
  .hint{font-family:"Chakra Petch",monospace;font-size:11px;color:#2EF2C5;letter-spacing:.12em}
</style>
</head>
<body>
<div class="bug">
  <div class="word">PAYOUT <span class="gold">STREET</span></div>
  <div class="hint">NIGHT CIRCUIT · LIVE · AD</div>
</div>
<p style="position:fixed;left:24px;bottom:24px;font-family:Chakra Petch,monospace;font-size:12px;color:rgba(244,241,234,.4)">OBS browser source · 1920×1080 · transparent</p>
</body>
</html>
